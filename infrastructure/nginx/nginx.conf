events {
    worker_connections 2048;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Sécurité des en-têtes HTTP Souverains
    server_tokens off;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Content-Security-Policy "default-src 'self' https: data: blob: 'unsafe-inline' 'unsafe-eval';" always;

    # Optimisation TLS
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384";

    # Rate limiting zone
    limit_req_zone $binary_remote_addr zone=sipat_limit:10m rate=20r/s;

    upstream backend_datacenter {
        server sipat-backend:5000;
    }

    server {
        listen 80;
        server_name sipat.gouv.cg;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name sipat.gouv.cg;

        ssl_certificate /etc/nginx/certs/sipat.gouv.cg.crt;
        ssl_certificate_key /etc/nginx/certs/sipat.gouv.cg.key;

        # Frontend statique et PWA distribué en Cloud Edge
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
            expires 1d;
            add_header Cache-Control "public, no-transform";
        }

        # Passerelle API vers Datacenter Gouvernemental
        location /api/ {
            limit_req zone=sipat_limit burst=30 nodelay;

            proxy_pass http://backend_datacenter;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 60s;
            proxy_read_timeout 60s;
        }
    }
}

